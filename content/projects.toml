# Selected work — the "#work" section on the home page.
#
# Edit this file, then run:  python3 build.py
#
# Order here is the order on the page. Exactly one project may set
# featured = true; it gets the wide card with the code pane beside it.
#
# kind controls the badge: "tool" (green), "research" (amber), anything else
# renders in the default grey. Every field except name and description is
# optional.

[[project]]
name = "ReqFlow"
kind = "app"
featured = true
description = """
Self-hosted purchase requisition and approval workflow for K-12 districts too
small for Skyward or Tyler ERP but tired of paper forms and email chains.
Multi-stage site/district/board approvals with ESIGN-compliant signatures, a
canonical budget encumbrance ledger, Amazon Business cXML PunchOut, and
per-line receiving with carrier tracking.
"""
tags = ["Next.js", "TypeScript", "PostgreSQL", "Docker"]
source = "https://github.com/tgunn-dev/ReqFlow"

code_filename = "ReqFlow — get-budget-for-approval.ts"
code = '''
// what an approver sees before signing
interface LineItemBudgetInfo {
  budgetCode: BudgetCode | null;
  budgetInfo: {
    allocation: number;
    encumbered: number;
    availableBefore: number;
    amountToEncumber: number;
    availableAfter: number;
    isOverBudget: boolean;
  } | null;
}
'''


[[project]]
name = "Google2Snipe-IT"
kind = "tool"
description = """
Syncs ChromeOS device data from the Google Admin SDK into Snipe-IT asset
inventory. Authenticates with a service account using domain-wide delegation,
paginates the full device list, creates models and categories automatically,
and handles API rate limiting with exponential backoff. Runs on a systemd timer.
"""
tags = ["Python", "Google Admin SDK", "Snipe-IT"]
source = "https://github.com/Gunn1/Google2Snipe-IT"


[[project]]
name = "Merakitosnipeit"
kind = "tool"
description = """
Pulls the device inventory from a Cisco Meraki organisation into Snipe-IT.
Caches categories and models at startup to keep API calls down, deduplicates by
serial or asset tag so runs are idempotent, and ships with APScheduler, systemd
timer, and Docker deployment paths.
"""
tags = ["Python", "Meraki API", "Docker"]
source = "https://github.com/Gunn1/Merakitosnipeit"


[[project]]
name = "toner-tracker-snipeit"
kind = "app"
description = """
A small toner stock and replacement tracker for schools, built on FastAPI and
SQLite. Pulls printer and asset data from Snipe-IT, raises low-stock alerts, and
puts the whole thing behind a simple web dashboard.
"""
tags = ["Python", "FastAPI", "SQLite"]
source = "https://github.com/Gunn1/toner-tracker-snipeit"


[[project]]
name = "SnipeITAgent"
kind = "agent"
description = """
A lightweight cross-platform agent that collects hostname, serial, model and
assigned user from a device and pushes it to Snipe-IT over the API. Runs
silently in the background and compiles to a standalone executable for macOS,
Windows and Linux.
"""
tags = ["Python", "cross-platform", "Snipe-IT"]
source = "https://github.com/Gunn1/SnipeITAgent"


[[project]]
name = "chronicle-engine"
kind = "plugin"
description = """
An AI-driven story and bounty engine for Minecraft servers. Generates evolving
narrative chapters, contracts, world events and peace/war cycles using Claude,
with a deterministic fallback mode when no API key is configured. Paper 1.21,
Java 21, Vault and GriefPrevention aware.
"""
tags = ["Java", "Paper API", "Claude API"]
source = "https://github.com/Gunn1/chronicle-engine"
